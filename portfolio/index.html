:13px;line-height:1.9}.stats{display:flex;gap:36px;margin-top:25px}.stats b{display:block;font:600 29px 'Space Grotesk'}.stats small{font-size:10px;color:var(--muted)}.skills{display:grid;grid-template-columns:.8fr 1.2fr;gap:60px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:28px}.panel h3{font:600 28px 'Space Grotesk'}.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.skilltop{display:flex;justify-content:space-between;font-size:11px;margin-bottom:10px}.track{height:5px;background:#ffffff18;border-radius:10px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8069fa,#4adbd1);border-radius:10px}.muted{color:var(--muted);font-size:10px;margin-top:7px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:35px}.project{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden;transition:.25s}.project:hover{transform:translateY(-6px);border-color:#927bff88}.art{height:170px;background:radial-gradient(circle at 70% 40%,#765cf966,transparent 45%),linear-gradient(140deg,#17152e,#0e1727);display:grid;place-items:center;position:relative}.mock{width:65%;height:68%;border:1px solid #b4a7ff66;border-radius:8px;background:#151a30;box-shadow:12px 15px 35px #0008;transform:rotateY(-12deg)}.mockhead{height:20px;background:#ffffff12;border-radius:8px 8px 0 0}.mockbody{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.mockbody i{height:35px;border:1px solid #9887ff55;border-radius:4px;background:#8069fa22}.projectcontent{padding:21px}.projectcontent small{color:var(--cyan);font-size:9px;letter-spacing:1.4px}.projectcontent h3{font:600 20px 'Space Grotesk';margin:10px 0}.projectcontent p{font-size:11px;line-height:1.8;color:var(--muted);min-height:78px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{font-size:8px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:20px}.contactbox{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:45px;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 10% 10%,#8069fa22,transparent 45%),var(--panel)}.contactbox p{color:var(--muted);font-size:13px;line-height:1.8}.contactform label{display:block;font-size:10px;color:var(--muted);margin-bottom:13px}.contactform input,.contactform textarea{display:block;width:100%;margin-top:7px;background:#080b14;border:1px solid var(--line);border-radius:7px;padding:12px;color:white;outline:none}.contactform input:focus,.contactform textarea:focus{border-color:var(--purple)}footer{padding:28px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.reveal{animation:rise .8s both}@keyframes morph{0%,100%{border-radius:43% 57% 62% 38%/44% 43% 57% 56%}50%{border-radius:57% 43% 40% 60%/55% 61% 39% 45%}}@keyframes levitate{50%{transform:translateY(-18px) rotateY(15deg) rotateX(8deg)}}@keyframes spin{to{transform:rotate(335deg)}}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.links{gap:12px}.links a{font-size:10px}.hero{grid-template-columns:1fr;padding:65px 0 25px}.visual{height:380px}.orb{width:210px;height:210px}.ring{width:330px}.ring.two{width:350px}.f1{top:45px}.f2{bottom:45px}.section{padding:70px 0}.about,.skills,.contactbox{grid-template-columns:1fr;gap:25px}.projects{grid-template-columns:1fr}.projectcontent p{min-height:0}.hero h1{font-size:58px}.skillgrid{gap:20px}.wrap{width:calc(100% - 34px)}}@media(max-width:440px){.links a:nth-child(2),.links a:nth-child(3){display:none}.hero h1{font-size:49px}.stats{gap:22px}.contactbox{padding:24px 18px}footer{gap:10px;flex-direction:column}}

return <div className="app"><header className="nav wrap"><a className="brand" href="#home"><b>P.</b> PRABHAKAR<small>KUMAR / PORTFOLIO</small></a><nav className="links"><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav><a className="pill" href="#contact">Let's talk ↗</a></header>
<main><section className="hero wrap" id="home"><div className="reveal"><span className="status"><i/> AVAILABLE FOR OPPORTUNITIES</span><h1>Building digital<br/><span className="grad">experiences</span><br/>that matter<span className="grad">.</span></h1><p className="lead">I'm <b>Er Prabhakar Kumar</b> — a Computer Science Engineer passionate about creating modern, useful and engaging web experiences.</p><div className="actions"><a className="btn" href="#projects">Explore my work ↗</a><a className="btn alt" href="mailto:erprabhakarkushwaha@gmail.com">Email me ↗</a></div><div className="hero-meta"><span>⌖ Purnia, Bihar, India</span><span>⌘ React · Java · Web</span></div></div><div className="visual"><div className="ring"></div><div className="ring two"></div><div className="orb"></div><div className="float f1">✧ Clean Code<small>Built with purpose</small></div><div className="float f2">✳ Creative Mind<small>Always learning</small></div></div></section>
<section className="section wrap" id="about"><span className="eyebrow">A LITTLE INTRODUCTION</span><div className="about"><div className="profile"><div className="initials">PK<span>.</span></div></div><div><h2>Curiosity meets <span className="grad">creation.</span></h2><p>I am a B.Tech Computer Science Engineering graduate from Moti Babu Institute of Technology. I enjoy learning technologies, solving problems and shaping ideas into clean, user-friendly digital products.</p><p>My current focus is strengthening my frontend skills and growing towards full-stack development. I believe good work comes from curiosity, consistency and attention to detail.</p><div className="stats"><div><b>68<span className="grad">%</span></b><small>B.Tech score</small></div><div><b>06<span className="grad">+</span></b><small>Core skill areas</small></div><div><b>∞</b><small>Learning mindset</small></div></div><p><b>Education:</b> B.Tech — Computer Science Engineering · Moti Babu Institute of Technology</p></div></div></section>

<section className="section wrap" id="projects"><span className="eyebrow">SELECTED WORK</span><h2>Ideas brought <span className="grad">to life.</span></h2><p className="sub">A few digital product and website concepts from my development journey.</p><div className="projects">{projects.map((p,i)=><article className="project" key={p[0]}><div className="art"><div className="mock"><div className="mockhead"></div><div className="mockbody"><i/><i/><i/><i/></div></div></div><div className="projectcontent"><small>{p[1]}</small><h3>{p[0]}</h3><p>{p[2]}</p><div className="tags">{p[3].map(t=><span key={t}>{t}</span>)}</div><p><a href={p[4]} target={p[4].startsWith('http')?'_blank':undefined} rel="noreferrer">Explore project ↗</a></p></div></article>)}</div></section>
<section className="section wrap" id="contact"><div className="contactbox"><div><span className="eyebrow">HAVE A PROJECT IN MIND?</span><h2>Let's create<br/><span className="grad">something great.</span></h2><p>Have an opportunity, idea or just want to connect? My inbox is open.</p><p>✉ erprabhakarkushwaha@gmail.com</p><p>☏ +91 9939557302</p><p>⌖ Purnia, Bihar, India</p><p><a href="https://github.com/Prabhakar9939" target="_blank">GitHub ↗</a>　<a href="https://www.linkedin.com/" target="_blank">LinkedIn ↗</a></p></div><form className="contactform" onSubmit={submit}><label>Your name<input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Enter your name"/></label><label>Email address<input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com"/></label><label>Your message<textarea required rows="4" value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="Tell me about your idea..."/></label><button className="btn" type="submit">Send message ↗</button>{sent&&<p className="muted">Your email app should open with your message.</p>}<p className="muted">This form opens your default email app. No data is stored.</p></form></div></section></main>
<footer className="wrap"><span>© {new Date().getFullYear()} Er Prabhakar Kumar</span><span>Designed & built with curiosity ♥</span><a href="#home">BACK TO TOP ↑</a></footer></div>}
